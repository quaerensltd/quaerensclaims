<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM4 Assessment Builder | Quaerens</title><link rel="stylesheet" href="/crm4-ui.css"><style>.assessment{grid-template-columns:1fr 1fr}.preview{white-space:pre-wrap;font:14px/1.55 ui-monospace,Consolas,monospace;max-height:75vh;overflow:auto;background:#f8fafc;padding:1rem;border-radius:10px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}.checks label{display:flex;align-items:center;gap:.5rem}.checks input{width:auto;min-height:auto}@media print{.sidebar,.topbar,.form-card,.notice{display:none}.shell,.assessment{display:block}.content{padding:0}.preview{max-height:none}.card{border:0;box-shadow:none}}@media(max-width:900px){.assessment,.checks{grid-template-columns:1fr}}</style></head>
<body><div class="shell"><aside class="sidebar"><img class="logo" src="/images/quaerens-logo.png" alt="Quaerens"><div class="workspace-mark">CRM4 Assessments</div><nav class="nav"><a href="/manager-dashboard.html">Dashboard</a><a href="/client-search.html">Client Search</a><a class="active" href="/crm4-assessment-builder.html">Assessments</a><button data-crm4-logout>Log out</button></nav></aside><main class="main"><header class="topbar"><div><p class="eyebrow">CRM4 draft assessment</p><h1>Solar and Spray Foam Assessments</h1></div></header><div class="content"><section class="grid assessment"><form id="form" class="card form-card grid form-grid"><label class="full">CRM4 client/case<select name="caseId" id="caseId" required><option value="">Select CRM4 case</option></select></label><label>Assessment route<select name="assessmentRoute" id="route"><option value="solar">Solar PV / Renewable Energy</option><option value="spray-foam">Spray Foam Loft Insulation</option></select></label><label>Status<select name="status"><option value="draft">Draft</option><option value="ready-for-review">Ready for review</option></select></label><label>Client name<input name="clientName" required></label><label>Reference<input name="reference"></label><label class="full">Property address<textarea name="propertyAddress"></textarea></label><label>Installer or provider<input name="provider"></label><label>Sale or installation date<input name="saleDate"></label><label class="full">Finance or payment route<input name="financeRoute"></label><label class="full">Issue summary<textarea name="issueSummary"></textarea></label><label class="full">Financial position<textarea name="financialPosition"></textarea></label><label class="full">Evidence available<textarea name="evidenceAvailable"></textarea></label><label class="full">Evidence gaps or cautions<textarea name="evidenceGaps"></textarea></label><div class="full checks"><label><input type="checkbox" name="flags" value="Sales promises reviewed"> Sales promises reviewed</label><label><input type="checkbox" name="flags" value="Finance route considered"> Finance route considered</label><label><input type="checkbox" name="flags" value="Evidence gaps identified"> Evidence gaps identified</label><label><input type="checkbox" name="flags" value="No outcome guarantee included"> No outcome guarantee included</label></div><div class="full actions"><button class="btn primary" type="submit" id="save">Save Shared CRM4 Assessment</button><button class="btn" type="button" id="rtf">Download Editable RTF</button><button class="btn" type="button" id="print">Print / Save PDF</button></div><button class="btn full" type="button" disabled>Send to Processing — Integration Pending</button><p id="result" class="full"></p></form><aside class="card"><p class="eyebrow">Draft preview</p><h2>Quaerens Assessment Preview</h2><div class="preview" id="preview"></div></aside></section><p class="notice" style="margin-top:1rem">Draft assessment only. Shared Processing integration is being completed; no case has been submitted.</p></div></main></div>
<script type="module" data-manual-bridge>
import { requireCrm2, bindLogout, db, functions, roleRoutes } from '/crm4-platform.js';
import { collection, getDocs, query, orderBy } from '/__crm4/sdk/10.8.0/firestore.js';
import { httpsCallable } from '/__crm4/sdk/10.8.0/functions.js';
const {user,membership}=await requireCrm2();bindLogout();
document.querySelector('a[href="/manager-dashboard.html"]').href=roleRoutes[membership.role]||'/crm4-login.html';
const form=document.getElementById('form'),preview=document.getElementById('preview'),result=document.getElementById('result'),params=new URLSearchParams(location.search);
let assessmentId=params.get('assessmentId')||'',revision=0,state='DRAFT',busy=false;
function values() { const data = Object.fromEntries(new FormData(form).entries()); data.assessmentRoute=form.elements.assessmentRoute.value; data.caseId=form.elements.caseId.value; data.flags = new FormData(form).getAll("flags"); return data; }
function report(data) { const route = data.assessmentRoute === "spray-foam" ? "Spray Foam Loft Insulation" : "Solar PV / Renewable Energy"; const flags = data.flags?.length ? data.flags.map(flag => `- ${flag}`).join("\n") : "- No assessment checks selected"; return ["QUAERENS CRM4 DRAFT ASSESSMENT","",`Assessment route: ${route}`,`CRM4 reference: ${data.reference || "[Not recorded]"}`,`Client: ${data.clientName || "[Not recorded]"}`,`Property: ${data.propertyAddress || "[Not recorded]"}`,`Installer / provider: ${data.provider || "[Not recorded]"}`,`Sale / installation date: ${data.saleDate || "[Not recorded]"}`,`Finance / payment route: ${data.financeRoute || "[Not recorded]"}`,"","ISSUE SUMMARY",data.issueSummary || "[Not recorded]","","FINANCIAL POSITION",data.financialPosition || "[Not recorded]","","EVIDENCE AVAILABLE",data.evidenceAvailable || "[Not recorded]","","EVIDENCE GAPS OR CAUTIONS",data.evidenceGaps || "[Not recorded]","","ASSESSMENT CHECKS",flags,"","PRELIMINARY NOTE","This draft organises the currently available information. It does not guarantee any refund, compensation, recovery or legal outcome.","","DOCUMENT STATUS","Draft CRM4 assessment only. No Processing case has been created."].join("\n"); }
function updatePreview() { preview.textContent = report(values()); }
function populate(data) { for (const [key,value] of Object.entries(data || {})) { if (key === "flags" && Array.isArray(value)) { form.querySelectorAll('input[name="flags"]').forEach(input => { input.checked = value.includes(input.value); }); } else if (form.elements[key] && typeof value === "string") form.elements[key].value = value; } updatePreview(); }
form.addEventListener("input", updatePreview); form.addEventListener("change", updatePreview);

const bridge=data=>httpsCallable(functions,'crm4ManualAssessment')(data).then(r=>r.data);
const cases=await getDocs(query(collection(db,'crm4Leads'),orderBy('updatedAt','desc')));
for(const item of cases.docs){const option=document.createElement('option');option.value=item.id;option.textContent=`${item.data().reference||'CRM4'} — ${item.data().clientName||'Unnamed client'}`;option.dataset.client=item.data().clientName||'';document.getElementById('caseId').append(option);}
document.getElementById('caseId').value=params.get('caseId')||'';
document.getElementById('caseId').addEventListener('change',()=>{form.elements.clientName.value=form.elements.caseId.selectedOptions[0]?.dataset.client||'';updatePreview();});
form.elements.assessmentRoute.value='spray-foam';form.elements.assessmentRoute.querySelector('[value=solar]').disabled=true;
form.elements.status.disabled=true;
const controls=document.createElement('div');controls.className='full grid';
controls.innerHTML='<p id="manualIdentity" aria-live="polite"></p><p>Governed manual Spray Foam route. Solar authoring is unavailable in this preserved contract. No legacy records are migrated.</p><button type="button" class="btn" id="submitReview">Submit for review</button><fieldset id="reviewChecks"><legend>Independent approval checklist</legend>'+['identity','facts','calculations','evidence','wording'].map(k=>`<label><input type="checkbox" data-review="${k}"> ${k}</label>`).join('')+'</fieldset><button type="button" class="btn" id="approveManual">Approve reviewed version</button><button type="button" class="btn" id="generateManual">Generate governed documents</button><button type="button" class="btn" id="issueManual">Issue (local capture only)</button><button type="button" class="btn" id="correctManual">Start correction revision</button>';
result.before(controls);result.setAttribute('role','status');
document.getElementById('reviewChecks').className='checks';
function renderState(){
 form.elements.status.replaceChildren(new Option(state,state));
 document.getElementById('caseId').disabled=!!assessmentId;form.elements.assessmentRoute.disabled=!!assessmentId;
 document.getElementById('save').disabled=busy||state!=='DRAFT';
 for(const [id,allowed]of Object.entries({submitReview:assessmentId&&state==='DRAFT',approveManual:state==='UNDER REVIEW',generateManual:state==='APPROVED',issueManual:state==='APPROVED',correctManual:state==='ISSUED'}))document.getElementById(id).disabled=busy||!allowed;
}
async function refresh(){
 const {assessment:a}=await bridge({action:'get',id:assessmentId});revision=a.revision;state=a.status;populate(a.structuredIntake?.manualForm||{});
 form.elements.caseId.value=a.crmLink.caseRef;
 document.getElementById('manualIdentity').textContent=`${a.qarReference} | ${a.status} | Revision ${a.revision} | Version ${a.currentVersion}`;
 history.replaceState(null,'',`?caseId=${encodeURIComponent(a.crmLink.caseRef)}&assessmentId=${encodeURIComponent(assessmentId)}`);renderState();
}
async function run(fn){if(busy)return;busy=true;result.textContent='Working…';renderState();try{await fn();result.textContent='Saved / action completed.';}catch(e){result.textContent=e.message;}finally{busy=false;renderState();}}
form.addEventListener('submit',e=>{e.preventDefault();run(async()=>{
 const data=values();data.caseId=form.elements.caseId.value;
 const saved=await bridge({action:assessmentId?'save':'create',id:assessmentId||undefined,leadId:data.caseId,revision,category:form.elements.assessmentRoute.value,form:data});
 assessmentId=saved.id||assessmentId;await refresh();
});});
document.getElementById('submitReview').onclick=()=>run(async()=>{await bridge({action:'submit',id:assessmentId,revision});await refresh();});
document.getElementById('correctManual').onclick=()=>run(async()=>{await bridge({action:'correct',id:assessmentId,revision});await refresh();});
for(const [id,name]of Object.entries({approveManual:'frameworkBAssessmentApprove',generateManual:'frameworkBAssessmentGenerateDocuments',issueManual:'frameworkBAssessmentIssue'}))document.getElementById(id).onclick=()=>run(async()=>{
 const checklist=Object.fromEntries([...document.querySelectorAll('[data-review]')].map(e=>[e.dataset.review,e.checked]));
 await httpsCallable(functions,name)({id:assessmentId,expectedRevision:revision,checklist});await refresh();
});
document.getElementById('rtf').onclick=()=>{const text=report(values()).replace(/\\/g,'\\\\').replace(/[{}]/g,'').replace(/\n/g,'\\par\n');const url=URL.createObjectURL(new Blob(['{\\rtf1\\ansi '+text+'}'],{type:'application/rtf'}));const a=document.createElement('a');a.href=url;a.download='quaerens-crm4-draft-assessment.rtf';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
document.getElementById('print').onclick=()=>window.print();
if(assessmentId){try{await refresh();}catch(e){state='UNAVAILABLE';result.textContent=e.message;}}
else{form.elements.caseId.dispatchEvent(new Event('change'));}
renderState();updatePreview();

</script></body></html>
