<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Secure Client Portal Administration | Quaerens</title><link rel="icon" href="/images/favicon.png" type="image/png">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script><script src="/__crm4/compat.js"></script>
<style>:root{font-family:Inter,Arial,sans-serif;color:#10213d;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{padding:18px 4vw;background:#071f49;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:15px}header img{width:180px;filter:brightness(0) invert(1)}main{width:min(1200px,94vw);margin:28px auto 60px}.card{background:#fff;border:1px solid #d8e3f1;border-radius:17px;padding:22px;box-shadow:0 12px 30px rgba(6,31,73,.08)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.wide{grid-column:1/-1}h1,h2,h3{color:#08285f;margin-top:0}label{display:block;font-weight:750;margin:11px 0 5px}input,textarea,select{width:100%;padding:11px;border:1px solid #bdcbe0;border-radius:9px;font:inherit}textarea{min-height:90px}button{border:0;border-radius:999px;padding:11px 16px;background:#155eef;color:#fff;font-weight:800;cursor:pointer;margin-top:10px}button.secondary{background:#eaf1ff;color:#0b3981}button.danger{background:#8a1c1c}.hide{display:none!important}.list{display:grid;gap:10px}.item{border:1px solid #d8e3f1;border-radius:12px;padding:13px}.muted{color:#5b6c84;line-height:1.55}.msg{min-height:1.2em;font-weight:750}.bad{color:#9d1c1c}.good{color:#087a3d}@media(max-width:700px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.card{padding:18px}button{width:100%}}</style></head>
<body><header><strong>Quaerens · Protected Portal Administration</strong><button id="logout" class="secondary hide">Secure logout</button></header><main>
<section id="login" class="card"><h1>Checking authorised staff access</h1><p class="muted">Your existing secure CRM4 session is being verified.</p><p id="loginMsg" class="msg"></p></section>
<section id="workspace" class="hide"><div class="grid"><section class="card"><h2>Portal cases</h2><button id="refresh" class="secondary">Refresh authorised list</button><div id="cases" class="list"></div></section><section class="card"><h2>Governed shared projection</h2><form id="caseForm"><input id="caseId" type="hidden"><label>CRM4 case ID</label><input id="crmCaseId" required><label>Client name</label><input id="clientName" required><label>Client email</label><input id="clientEmail" type="email" required><label>Case reference</label><input id="caseRef" required><label>Category</label><input id="claimType" required><label>Shared status</label><input id="status" required><label>Client-shared summary</label><textarea id="summary"></textarea><label>Client-shared next step</label><textarea id="nextStep"></textarea><button>Save controlled projection</button></form><p id="caseMsg" class="msg"></p></section>
<section id="actions" class="card wide hide"><h2 id="activeTitle">Selected case</h2><div class="grid"><form id="inviteForm"><h3>Secure invitation</h3><label>Expiry hours (1–168)</label><input id="expiry" type="number" min="1" max="168" value="48"><button>Create single-purpose invitation</button><p id="inviteMsg" class="msg"></p></form><form id="messageForm"><h3>Client-shared message</h3><textarea id="message" maxlength="8000" required></textarea><button>Share message</button><p id="messageMsg" class="msg"></p></form><form id="documentForm"><h3>Share protected document</h3><input id="documentFile" type="file" accept=".pdf,.doc,.docx,.txt,image/jpeg,image/png,image/webp" required><label>Title</label><input id="documentTitle" required><label>Category</label><input id="documentCategory" value="Case document"><label>Status</label><select id="documentStatus"><option>READY FOR CLIENT REVIEW</option><option>DRAFT</option><option>INTERNAL REVIEW</option><option>READY TO SEND</option><option>SENT</option></select><button>Upload and share securely</button><p id="documentMsg" class="msg"></p></form><form id="revokeForm"><h3>Revoke access</h3><label>Authorised reason</label><textarea id="reason" required></textarea><button class="danger">Revoke without deleting history</button><p id="revokeMsg" class="msg"></p></form></div></section></div></section>
</main><script>
const config={apiKey:"crm4-local-only",authDomain:"crm4-local-only",projectId:"demo-quaerens-crm4",storageBucket:"crm4-local-only"};firebase.initializeApp(config);const auth=firebase.auth(),fn=firebase.app().functions("us-central1"),storage=firebase.storage();let rows=[],activeCase="",authResolved=false;const $=id=>document.getElementById(id),call=n=>fn.httpsCallable(n),show=(id,on)=>$(id).classList.toggle("hide",!on),safe=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),msg=(id,v,bad=false)=>{$(id).textContent=v||"";$(id).className="msg "+(bad?"bad":"good")};
async function load(){const result=(await call("portalStaffListCases")()).data;rows=result.cases||[];$("cases").innerHTML=rows.map(x=>`<div class="item"><strong>${safe(x.clientName||"Portal case")}</strong><p>${safe(x.caseRef)} · ${safe(x.status)} · ${safe(x.accessState)}</p><button type="button" data-open="${safe(x.id)}">Open</button></div>`).join("")||'<p class="muted">No portal projections found.</p>';show("workspace",true);show("login",false);show("logout",true);const requested=new URLSearchParams(location.search).get("caseId");if(requested){const button=$("cases").querySelector(`[data-open="${CSS.escape(requested)}"]`);if(button)button.click();else msg("caseMsg","This portal case is not available to your authorised CRM4 account.",true)}}
$("refresh").onclick=load;$("cases").onclick=e=>{const id=e.target.dataset.open;if(!id)return;const x=rows.find(v=>v.id===id);activeCase=id;$("caseId").value=id;$("crmCaseId").value=x.crmLink&&x.crmLink.caseId||"";for(const f of ["clientName","clientEmail","caseRef","claimType","status","summary","nextStep"])$(f).value=x[f]||"";$("activeTitle").textContent=x.caseRef||"Selected case";show("actions",true)};
$("caseForm").onsubmit=async e=>{e.preventDefault();try{const payload={};for(const f of ["caseId","crmCaseId","clientName","clientEmail","caseRef","claimType","status","summary","nextStep"])payload[f]=$(f).value.trim();const out=(await call("portalStaffUpsertCase")(payload)).data;activeCase=out.id;msg("caseMsg","Controlled projection saved.");await load()}catch(err){msg("caseMsg",err.message,true)}};
$("inviteForm").onsubmit=async e=>{e.preventDefault();try{const out=(await call("portalStaffCreateInvitation")({caseId:activeCase,expiresHours:Number($("expiry").value)})).data;await navigator.clipboard.writeText(out.claimUrl);msg("inviteMsg","Invitation created and copied. It expires in "+out.expiresHours+" hours.")}catch(err){msg("inviteMsg",err.message,true)}};
$("messageForm").onsubmit=async e=>{e.preventDefault();try{await call("portalStaffCreateMessage")({caseId:activeCase,body:$("message").value.trim()});$("message").value="";msg("messageMsg","Message shared securely.")}catch(err){msg("messageMsg",err.message,true)}};
$("documentForm").onsubmit=async e=>{e.preventDefault();const file=$("documentFile").files[0];try{if(!activeCase||!file)throw new Error("Select a case and file.");if(file.size>15*1024*1024)throw new Error("Files must be smaller than 15 MB.");const id=crypto.randomUUID(),name=file.name.replace(/[^\w. -]/g,"_"),path=`clientPortal/${activeCase}/shared/${id}_${name}`;await storage.ref(path).put(file,{contentType:file.type,customMetadata:{caseId:activeCase,clientVisible:"true"}});await call("portalStaffRegisterDocument")({caseId:activeCase,documentId:id,storagePath:path,title:$("documentTitle").value.trim(),category:$("documentCategory").value.trim(),status:$("documentStatus").value,contentType:file.type,size:file.size,version:1});$("documentFile").value="";msg("documentMsg","Document shared securely.")}catch(err){msg("documentMsg",err.message,true)}};
$("revokeForm").onsubmit=async e=>{e.preventDefault();try{await call("portalStaffRevokeAccess")({caseId:activeCase,reason:$("reason").value.trim()});msg("revokeMsg","Access revoked; case history preserved.");await load()}catch(err){msg("revokeMsg",err.message,true)}};$("logout").onclick=async()=>{await auth.signOut();location.replace("/login.html")};setTimeout(()=>{if(!authResolved)msg("loginMsg","Staff access verification is taking longer than expected. Please refresh or return to Processing and try again.",true)},12000);auth.onAuthStateChanged(async user=>{authResolved=true;if(!user){location.replace(`/login.html?next=${encodeURIComponent(location.pathname+location.search)}`);return}try{await user.getIdToken();await load()}catch(err){console.error("Authorised portal workspace load failed",err);msg("loginMsg","Your authorised portal workspace could not be loaded. Please refresh or return to Processing and try again.",true)}});
</script></body></html>
