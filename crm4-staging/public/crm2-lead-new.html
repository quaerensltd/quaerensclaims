<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create CRM2 Lead | Quaerens</title><link rel="stylesheet" href="/crm2-ui.css"></head><body><div class="shell"><aside class="sidebar"><img class="logo" src="/images/quaerens-logo.png" alt="Quaerens"><div class="workspace-mark">CRM2</div><nav class="nav"><a href="/crm2.html">Dashboard</a><a href="/crm2-cases.html">CRM2 Cases</a><a class="active" href="/crm2-lead-new.html">Create Manual Lead</a><button data-crm2-logout>Log out</button></nav></aside><main class="main"><header class="topbar"><div><p class="eyebrow">CRM2 manual intake</p><h1>Create Manual Lead</h1></div></header><div class="content"><form id="leadForm" class="card grid form-grid"><label>Client name<input name="clientName" autocomplete="name" required></label><label>Telephone<input name="telephone" type="tel" autocomplete="tel"></label><label>Email<input name="email" type="email" autocomplete="email"></label><label>Issue<select name="issue" required><option value="">Select issue</option><option>Solar PV / Renewable Energy</option><option>Spray Foam Loft Insulation</option><option>Other instructed matter</option></select></label><label>Preferred contact time<input name="preferredContactTime"></label><label>Assigned user<input name="assignedUserName" placeholder="Leave blank if unassigned"></label><label class="full">Notes<textarea name="notes"></textarea></label><div class="full notice">This creates a manual CRM2 record only. It will not enter the internet-lead queue or live CRM.</div><div class="full actions"><button class="btn primary" id="save" type="submit">Create CRM2 Lead</button><a class="btn" href="/crm2-cases.html">Cancel</a></div><p id="result" class="full"></p></form></div></main></div><script type="module">
import{requireCrm2,bindLogout,db,appendAudit}from'/crm2-platform.js';import{collection,addDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
const {user,membership}=await requireCrm2(['lister','manager','administrator']);bindLogout();const form=document.getElementById('leadForm'),result=document.getElementById('result');form.addEventListener('submit',async event=>{event.preventDefault();const button=document.getElementById('save');button.disabled=true;const data=Object.fromEntries(new FormData(form).entries());try{const reference='CRM2-'+new Date().toISOString().slice(0,10).replaceAll('-','')+'-'+Math.random().toString(36).slice(2,6).toUpperCase();const record={workspaceId:'CRM2',workspaceLabel:'CRM2',sourceWorkspace:'CRM2',source:'manual_crm2',clientName:data.clientName.trim(),telephone:data.telephone.trim(),email:data.email.trim().toLowerCase(),issue:data.issue,notes:data.notes.trim(),preferredContactTime:data.preferredContactTime.trim(),assignedUserName:data.assignedUserName.trim(),assignedUserId:'',status:'new',reference,createdBy:user.uid,createdByName:membership.displayName||membership.email||'',createdAt:serverTimestamp(),updatedAt:serverTimestamp(),audit:appendAudit([],'lead-created',user.uid,'Manual CRM2 lead created')};const saved=await addDoc(collection(db,'crm2Leads'),record);location.replace('/crm2-case.html?id='+encodeURIComponent(saved.id))}catch(error){result.textContent=error.message;result.className='full notice';button.disabled=false}});
</script></body></html>
