<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/images/favicon.png"><title>CRM2 Login | Quaerens</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1rem;font:16px Inter,Arial;background:linear-gradient(145deg,#082f49,#0c4a6e);color:#0f172a}.card{width:min(440px,100%);background:#fff;border-radius:20px;padding:2rem;box-shadow:0 30px 70px rgba(0,0,0,.28)}img{width:190px}.eyebrow{color:#2563eb;text-transform:uppercase;letter-spacing:.08em;font-weight:900;font-size:.75rem}h1{margin:.6rem 0}.field{display:grid;gap:.4rem;margin:1rem 0;font-weight:800}input{min-height:46px;border:1px solid #cbd5e1;border-radius:9px;padding:.7rem;font:inherit}.btn{width:100%;min-height:46px;border:0;border-radius:9px;background:#2563eb;color:#fff;font-weight:900;cursor:pointer}.link{border:0;background:none;color:#1d4ed8;font-weight:800;cursor:pointer;margin-top:1rem}.message{padding:.75rem;border-radius:8px;background:#eff6ff;color:#1e40af}.error{background:#fef2f2;color:#b91c1c}</style></head>
<body><main class="card"><img src="/images/quaerens-logo.png" alt="Quaerens"><p class="eyebrow">Secure operational workspace</p><h1>CRM2 Login</h1><p>Sign in with your authorised CRM2 account.</p><form id="form"><label class="field">Email<input id="email" type="email" autocomplete="email" required></label><label class="field">Password<input id="password" type="password" autocomplete="current-password" required></label><button class="btn" id="submit" type="submit">Log in to CRM2</button></form><button class="link" id="reset" type="button">Reset password</button><p id="message" class="message" hidden></p></main>
<script type="module">
import{auth,db,roleRoutes}from'/crm2-platform.js';
import{signInWithEmailAndPassword,sendPasswordResetEmail,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
import{doc,getDoc}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
const form=document.getElementById('form'),email=document.getElementById('email'),password=document.getElementById('password'),submit=document.getElementById('submit'),message=document.getElementById('message');
const show=(text,error=false)=>{message.hidden=false;message.textContent=text;message.classList.toggle('error',error)};
async function enter(user){const snap=await getDoc(doc(db,'crm2Memberships',user.uid));const member=snap.exists()?snap.data():null;if(!member||member.active!==true||member.workspaceId!=='CRM2'){await signOut(auth);show('This account is not authorised for CRM2.',true);return false}location.replace(roleRoutes[member.role]||'/crm2-login.html?error=role');return true}
form.addEventListener('submit',async event=>{event.preventDefault();submit.disabled=true;submit.textContent='Checking access…';try{const credential=await signInWithEmailAndPassword(auth,email.value.trim(),password.value);await enter(credential.user)}catch(error){show(error.code==='auth/invalid-credential'?'Invalid email or password.':error.message,true);submit.disabled=false;submit.textContent='Log in to CRM2'}});
document.getElementById('reset').addEventListener('click',async()=>{if(!email.value.trim()){show('Enter your email address first.',true);return}try{await sendPasswordResetEmail(auth,email.value.trim());show('Password reset email sent if the account exists.')}catch(error){show(error.message,true)}});
onAuthStateChanged(auth,user=>{if(user)enter(user).catch(error=>show(error.message,true))});
const error=new URLSearchParams(location.search).get('error');if(error==='workspace-access')show('This account is not authorised for CRM2.',true);
</script></body></html>
