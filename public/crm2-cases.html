<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM2 Cases | Quaerens</title><link rel="stylesheet" href="/crm2-ui.css"></head>
<body><div class="shell"><aside class="sidebar"><img class="logo" src="/images/quaerens-logo.png" alt="Quaerens"><div class="workspace-mark">CRM2 Case Register</div><nav class="nav"><a href="/crm2.html">Dashboard</a><a class="active" href="/crm2-cases.html">CRM2 Cases</a><a href="/crm2-lead-new.html" data-create>Create Manual Lead</a><a href="/crm2-assessment-builder.html">Assessments</a><button data-crm2-logout>Log out</button></nav></aside><main class="main"><header class="topbar"><div><p class="eyebrow">Shared CRM2 records</p><h1>Case Register</h1></div><a class="btn primary" href="/crm2-lead-new.html" data-create>Create Manual Lead</a></header><div class="content"><section class="card"><div class="filters"><input id="search" type="search" placeholder="Search client, reference, issue, email or phone"><select id="status"><option value="all">All statuses</option><option value="new">New</option><option value="awaiting-manager-review">Awaiting manager review</option><option value="information-requested">Information requested</option><option value="approved">Approved</option><option value="rejected">Rejected</option><option value="closer-assigned">Closer assigned</option><option value="appointment-booked">Appointment booked</option><option value="onboarded">Onboarded</option></select><select id="route"><option value="all">All routes</option><option>Solar PV / Renewable Energy</option><option>Spray Foam Loft Insulation</option></select><input id="assigned" placeholder="Filter assigned user"></div><div id="records" style="margin-top:1rem"></div></section></div></main></div>
<script type="module">
import { requireCrm2, bindLogout, db } from "/crm2-platform.js";
import { collection, onSnapshot, query, orderBy, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
const { membership } = await requireCrm2(); bindLogout();
if (membership.role === "closer") document.querySelectorAll("[data-create]").forEach(element => element.remove());
const escapeHtml = value => String(value || "").replace(/[&<>"']/g, character => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[character]));
let records = [];
const fields = ["search", "status", "route", "assigned"].map(id => document.getElementById(id));
function render() {
  const term = fields[0].value.trim().toLowerCase(); const status = fields[1].value; const route = fields[2].value; const assigned = fields[3].value.trim().toLowerCase();
  const filtered = records.filter(item => (status === "all" || item.status === status) && (route === "all" || item.issue === route) && (!assigned || String(item.assignedUserName || "").toLowerCase().includes(assigned)) && (!term || [item.clientName,item.reference,item.issue,item.email,item.telephone].join(" ").toLowerCase().includes(term)));
  document.getElementById("records").innerHTML = filtered.length ? `<div class="table-wrap"><table><thead><tr><th>Client</th><th>Contact</th><th>Issue</th><th>Status</th><th>Assigned</th><th>Updated</th><th></th></tr></thead><tbody>${filtered.map(item => `<tr><td><strong>${escapeHtml(item.clientName)}</strong><div class="muted">${escapeHtml(item.reference)}</div></td><td>${escapeHtml(item.telephone)}<div class="muted">${escapeHtml(item.email)}</div></td><td>${escapeHtml(item.issue)}</td><td><span class="badge">${escapeHtml(item.status)}</span></td><td>${escapeHtml(item.assignedUserName || "Unassigned")}</td><td>${escapeHtml(item.updatedAt?.toDate ? item.updatedAt.toDate().toLocaleString("en-GB") : "")}</td><td><a class="btn" href="/crm2-case.html?id=${encodeURIComponent(item.id)}">Open</a></td></tr>`).join("")}</tbody></table></div>` : `<div class="empty"><h2>No CRM2 cases have been created yet.</h2><p>Create a manual lead to begin.</p></div>`;
}
fields.forEach(field => field.addEventListener(field.tagName === "SELECT" ? "change" : "input", render));
const leadQuery = membership.role === "closer" ? query(collection(db,"crm2Leads"), where("status","in",["approved","closer-assigned","appointment-booked","onboarded"]), orderBy("updatedAt","desc")) : query(collection(db,"crm2Leads"), orderBy("updatedAt","desc"));
onSnapshot(leadQuery, snapshot => { records = snapshot.docs.map(entry => ({id:entry.id,...entry.data()})); render(); }, error => { document.getElementById("records").innerHTML = `<div class="notice">${escapeHtml(error.message)}</div>`; });
</script></body></html>
