<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM2 Assessment Builder | Quaerens</title><link rel="stylesheet" href="/crm2-ui.css"><style>.assessment{grid-template-columns:1fr 1fr}.preview{white-space:pre-wrap;font:14px/1.55 ui-monospace,Consolas,monospace;max-height:75vh;overflow:auto;background:#f8fafc;padding:1rem;border-radius:10px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}.checks label{display:flex;align-items:center;gap:.5rem}.checks input{width:auto;min-height:auto}@media print{.sidebar,.topbar,.form-card,.notice{display:none}.shell,.assessment{display:block}.content{padding:0}.preview{max-height:none}.card{border:0;box-shadow:none}}@media(max-width:900px){.assessment,.checks{grid-template-columns:1fr}}</style></head>
<body><div class="shell"><aside class="sidebar"><img class="logo" src="/images/quaerens-logo.png" alt="Quaerens"><div class="workspace-mark">CRM2 Assessments</div><nav class="nav"><a href="/manager-dashboard.html">Dashboard</a><a href="/client-search.html">Client Search</a><a class="active" href="/crm2-assessment-builder.html">Assessments</a><button data-crm2-logout>Log out</button></nav></aside><main class="main"><header class="topbar"><div><p class="eyebrow">CRM2 draft assessment</p><h1>Solar and Spray Foam Assessments</h1></div></header><div class="content"><section class="grid assessment"><form id="form" class="card form-card grid form-grid"><label class="full">CRM2 client/case<select name="caseId" id="caseId" required><option value="">Select CRM2 case</option></select></label><label>Assessment route<select name="assessmentRoute" id="route"><option value="solar">Solar PV / Renewable Energy</option><option value="spray-foam">Spray Foam Loft Insulation</option></select></label><label>Status<select name="status"><option value="draft">Draft</option><option value="ready-for-review">Ready for review</option></select></label><label>Client name<input name="clientName" required></label><label>Reference<input name="reference"></label><label class="full">Property address<textarea name="propertyAddress"></textarea></label><label>Installer or provider<input name="provider"></label><label>Sale or installation date<input name="saleDate"></label><label class="full">Finance or payment route<input name="financeRoute"></label><label class="full">Issue summary<textarea name="issueSummary"></textarea></label><label class="full">Financial position<textarea name="financialPosition"></textarea></label><label class="full">Evidence available<textarea name="evidenceAvailable"></textarea></label><label class="full">Evidence gaps or cautions<textarea name="evidenceGaps"></textarea></label><div class="full checks"><label><input type="checkbox" name="flags" value="Sales promises reviewed"> Sales promises reviewed</label><label><input type="checkbox" name="flags" value="Finance route considered"> Finance route considered</label><label><input type="checkbox" name="flags" value="Evidence gaps identified"> Evidence gaps identified</label><label><input type="checkbox" name="flags" value="No outcome guarantee included"> No outcome guarantee included</label></div><div class="full actions"><button class="btn primary" type="submit" id="save">Save Shared CRM2 Assessment</button><button class="btn" type="button" id="rtf">Download Editable RTF</button><button class="btn" type="button" id="print">Print / Save PDF</button></div><button class="btn full" type="button" disabled>Send to Processing — Integration Pending</button><p id="result" class="full"></p></form><aside class="card"><p class="eyebrow">Draft preview</p><h2>Quaerens Assessment Preview</h2><div class="preview" id="preview"></div></aside></section><p class="notice" style="margin-top:1rem">Draft assessment only. Shared Processing integration is being completed; no case has been submitted.</p></div></main></div>
<script type="module">
import { requireCrm2, bindLogout, db, appendAudit, roleRoutes } from "/crm2-platform.js";
import { collection, getDocs, query, orderBy, where, doc, getDoc, addDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
const { user, membership } = await requireCrm2(); bindLogout();
document.querySelector('a[href="/manager-dashboard.html"]').href = roleRoutes[membership.role] || "/crm2-login.html";
const form = document.getElementById("form"); const preview = document.getElementById("preview"); const result = document.getElementById("result"); const params = new URLSearchParams(location.search); const legacyKey = "quaerens.crm2.assessmentDraft.v1"; let assessmentId = params.get("assessmentId") || ""; let migratedLegacy = false;
function values() { const data = Object.fromEntries(new FormData(form).entries()); data.flags = new FormData(form).getAll("flags"); return data; }
function report(data) { const route = data.assessmentRoute === "spray-foam" ? "Spray Foam Loft Insulation" : "Solar PV / Renewable Energy"; const flags = data.flags?.length ? data.flags.map(flag => `- ${flag}`).join("\n") : "- No assessment checks selected"; return ["QUAERENS CRM2 DRAFT ASSESSMENT","",`Assessment route: ${route}`,`CRM2 reference: ${data.reference || "[Not recorded]"}`,`Client: ${data.clientName || "[Not recorded]"}`,`Property: ${data.propertyAddress || "[Not recorded]"}`,`Installer / provider: ${data.provider || "[Not recorded]"}`,`Sale / installation date: ${data.saleDate || "[Not recorded]"}`,`Finance / payment route: ${data.financeRoute || "[Not recorded]"}`,"","ISSUE SUMMARY",data.issueSummary || "[Not recorded]","","FINANCIAL POSITION",data.financialPosition || "[Not recorded]","","EVIDENCE AVAILABLE",data.evidenceAvailable || "[Not recorded]","","EVIDENCE GAPS OR CAUTIONS",data.evidenceGaps || "[Not recorded]","","ASSESSMENT CHECKS",flags,"","PRELIMINARY NOTE","This draft organises the currently available information. It does not guarantee any refund, compensation, recovery or legal outcome.","","DOCUMENT STATUS","Draft CRM2 assessment only. No Processing case has been created."].join("\n"); }
function updatePreview() { preview.textContent = report(values()); }
function populate(data) { for (const [key,value] of Object.entries(data || {})) { if (key === "flags" && Array.isArray(value)) { form.querySelectorAll('input[name="flags"]').forEach(input => { input.checked = value.includes(input.value); }); } else if (form.elements[key] && typeof value === "string") form.elements[key].value = value; } updatePreview(); }
form.addEventListener("input", updatePreview); form.addEventListener("change", updatePreview);
const closerStatuses = ["approved","closer-assigned","appointment-booked","onboarded"];
const caseQuery = membership.role === "closer" ? query(collection(db,"crm2Leads"),where("status","in",closerStatuses),orderBy("updatedAt","desc")) : query(collection(db,"crm2Leads"),orderBy("updatedAt","desc"));
const cases = await getDocs(caseQuery); cases.docs.forEach(item => { const option = document.createElement("option"); option.value = item.id; option.textContent = `${item.data().reference || "CRM2"} — ${item.data().clientName || "Unnamed client"}`; option.dataset.client = item.data().clientName || ""; option.dataset.reference = item.data().reference || ""; document.getElementById("caseId").appendChild(option); });
document.getElementById("caseId").addEventListener("change", event => { const selected = event.target.selectedOptions[0]; if (selected) { form.elements.clientName.value = selected.dataset.client || form.elements.clientName.value; form.elements.reference.value = selected.dataset.reference || form.elements.reference.value; updatePreview(); } });
if (params.get("caseId")) { document.getElementById("caseId").value = params.get("caseId"); document.getElementById("caseId").dispatchEvent(new Event("change")); }
if (params.get("route")) document.getElementById("route").value = params.get("route");
if (assessmentId) { const snapshot = await getDoc(doc(db,"crm2Assessments",assessmentId)); if (snapshot.exists()) populate(snapshot.data()); }
else { try { const legacy = JSON.parse(localStorage.getItem(legacyKey) || "null"); if (legacy) { populate({...legacy,assessmentRoute:legacy.route === "spray-foam" ? "spray-foam" : "solar",status:"draft"}); migratedLegacy = true; result.textContent = "Phase 1 draft restored. Select a CRM2 case and save to migrate it to shared storage."; } } catch { localStorage.removeItem(legacyKey); } }
form.addEventListener("submit", async event => { event.preventDefault(); const button = document.getElementById("save"); button.disabled = true; const data = values(); try { if (!data.caseId) throw new Error("Select a CRM2 case."); if (assessmentId) { const existing = await getDoc(doc(db,"crm2Assessments",assessmentId)); await updateDoc(doc(db,"crm2Assessments",assessmentId), {...data,workspaceId:"CRM2",updatedAt:serverTimestamp(),audit:appendAudit(existing.data().audit,"assessment-updated",user.uid,data.status)}); } else { const saved = await addDoc(collection(db,"crm2Assessments"), {...data,workspaceId:"CRM2",workspaceLabel:"CRM2",sourceWorkspace:"CRM2",createdBy:user.uid,createdByName:membership.displayName || membership.email || "",createdAt:serverTimestamp(),updatedAt:serverTimestamp(),audit:appendAudit([],migratedLegacy ? "phase1-draft-migrated" : "assessment-created",user.uid,data.assessmentRoute)}); assessmentId = saved.id; history.replaceState(null,"",`/crm2-assessment-builder.html?caseId=${encodeURIComponent(data.caseId)}&assessmentId=${encodeURIComponent(saved.id)}`); } if (migratedLegacy) { localStorage.removeItem(legacyKey); migratedLegacy = false; } result.textContent = "Shared CRM2 assessment saved."; } catch (error) { result.textContent = error.message; } finally { button.disabled = false; } });
document.getElementById("rtf").addEventListener("click", () => { const text = report(values()).replace(/\\/g,"\\\\").replace(/[{}]/g,"").replace(/\n/g,"\\par\n"); const blob = new Blob([`{\\rtf1\\ansi\\deff0 ${text}}`],{type:"application/rtf"}); const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = "quaerens-crm2-draft-assessment.rtf"; link.click(); URL.revokeObjectURL(link.href); });
document.getElementById("print").addEventListener("click", () => window.print()); updatePreview();
</script></body></html>
