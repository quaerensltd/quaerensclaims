<script>
  // Quaerens persistent language switcher
  function quaerensSetLanguage(lang) {
    var value = lang === 'en' ? '' : '/en/' + lang;
    var expires = '; expires=' + new Date(Date.now() + 365 * 24 * 60 * 60 * 1000).toUTCString();
    var hostname = window.location.hostname;
    document.cookie = 'googtrans=' + value + expires + '; path=/';
    if (hostname) {
      document.cookie = 'googtrans=' + value + expires + '; domain=' + hostname + '; path=/';
      var parts = hostname.split('.');
      if (parts.length > 2) {
        document.cookie = 'googtrans=' + value + expires + '; domain=.' + parts.slice(-2).join('.') + '; path=/';
      }
    }
    localStorage.setItem('quaerensLanguage', lang);
    window.location.reload();
  }

  function quaerensReadTranslateCookie() {
    var match = document.cookie.match(/(?:^|; )googtrans=([^;]*)/);
    if (!match) return '';
    var decoded = decodeURIComponent(match[1]);
    var parts = decoded.split('/');
    return parts.length >= 3 ? parts[2] : '';
  }

  function quaerensInitLanguageSelect() {
    var select = document.getElementById('quaerensLanguageSelect');
    if (!select) return;
    var lang = quaerensReadTranslateCookie() || localStorage.getItem('quaerensLanguage') || 'en';
    select.value = lang;
  }

  function googleTranslateElementInit() {
    new google.translate.TranslateElement({
      pageLanguage: 'en',
      includedLanguages: 'en,nl,es,fr,de,it,sv,el',
      autoDisplay: false
    }, 'google_translate_element');
    quaerensInitLanguageSelect();
  }

  document.addEventListener('DOMContentLoaded', quaerensInitLanguageSelect);
</script>

  <section class="hero-section"><div class="hero-overlay"></div><div class="hero-content"><div class="hero-inner"><div class="inline-flex items-center gap-2 bg-white/10 border border-white/20 rounded-full px-4 py-2 text-sm font-medium mb-6"><span>Section 75 evidence guide</span></div><h1>Section 75 Credit Card Complaints</h1><p>Section 75 is part of the Consumer Credit Act 1974. In some credit-card purchases, the card issuer may share responsibility with the supplier if there has been a breach of contract or misrepresentation.</p><p>Quaerens does not decide eligibility. We help organise your evidence, complaint documents, chronology and possible next steps so the card provider can see the issue more clearly.</p><div class="hero-checklist"><span>✓ <strong>Credit card payment evidence</strong> linked to the supplier and purchase</span><span>✓ <strong>Breach or misrepresentation evidence</strong> showing what went wrong</span><span>✓ <strong>Complaint chronology</strong> with dates, replies and losses</span><span>✓ <strong>Clear route review</strong> for Section 75, chargeback or escalation</span></div><div class="flex flex-wrap items-center gap-4 mt-8"><a href="#request-assessment" data-scroll-target="request-assessment" class="cta-button cta-primary">Request My Free Initial Assessment</a><a href="#evidence-checklist" class="cta-button cta-secondary">See What Evidence I Need</a></div><div class="quick-panel"><p class="font-extrabold text-lg" style="color:#0f172a!important;">Free initial assessment</p><ul><li>✓ Clear explanation of useful evidence</li><li>✓ No obligation to proceed</li><li>✓ Practical complaint-document support</li><li>✓ No guaranteed refund, complaint result or Ombudsman decision</li></ul></div></div></div></section>

  <section class="section-wrap py-6"><div class="info-box fade-up"><h2 class="text-3xl font-extrabold text-gray-900 mb-4">What Is Section 75?</h2><p class="text-gray-700 mb-4">Section 75 of the Consumer Credit Act 1974 can make a credit-card issuer jointly liable with the supplier in some situations. In plain English, if a qualifying purchase involved a breach of contract or misrepresentation, the card provider may need to consider the complaint as well as the supplier.</p><p class="text-gray-700 mb-4">The usual focus is the relationship between the customer, the credit provider and the supplier, the value of the purchase, what was promised, what was delivered, and what evidence proves the problem.</p><div class="rounded-2xl bg-blue-50 border border-blue-100 p-5"><p class="font-bold text-blue-900 mb-2">Important</p><p class="text-gray-700">Section 75 is not automatic. Eligibility depends on the purchase, payment route, supplier relationship, value, timing and evidence.</p></div></div></section>

  <section class="section-wrap py-6"><div class="info-box soft-blue fade-up"><h2 class="text-3xl font-extrabold text-gray-900 mb-4">When Can Section 75 Apply?</h2><p class="text-gray-700 mb-6">Section 75 may be relevant where a qualifying credit-card or connected-credit purchase involves goods or services that were not supplied as promised, were misrepresented, or breached the contract.</p><div class="card-grid"><div class="feature-card"><h3>Goods</h3><p>Faulty goods, non-delivery, products not as described, missing parts, defective furniture, vehicles, home-improvement products or other purchases may be relevant if the conditions are met.</p></div><div class="feature-card"><h3>Services</h3><p>Travel bookings, building work, kitchen installations, solar panels, spray foam, holiday park purchases, cancelled services or failed contractor work may need evidence review.</p></div><div class="feature-card"><h3>Misrepresentation</h3><p>Sales promises, brochures, finance explanations, income projections, guarantees or claims about suitability may matter where they influenced the purchase.</p></div><div class="feature-card"><h3>Breach of contract</h3><p>Evidence may show the supplier failed to deliver, supplied something materially different, refused a valid remedy or stopped trading before completing the contract.</p></div></div></div></section>

  <section class="section-wrap py-6"><div class="info-box fade-up"><h2 class="text-3xl font-extrabold text-gray-900 mb-4">When Section 75 Usually Does NOT Apply</h2><p class="text-gray-700 mb-6">A declined Section 75 complaint is often about the payment route or missing legal link rather than the underlying unfairness. These situations need careful checking:</p><div class="card-grid"><div class="feature-card"><h3>Debit cards, cash or bank transfer</h3><p>Ordinary debit-card, cash and bank-transfer payments are not Section 75 credit-card payments, although other complaint routes may exist.</p></div><div class="feature-card"><h3>Some PayPal or third-party structures</h3><p>Intermediaries can complicate the direct link between card issuer, customer and supplier. The exact payment flow matters.</p></div><div class="feature-card"><h3>Outside qualifying limits</h3><p>Purchase value can matter. Keep the full invoice and payment records so the total cash price and card payment can be checked.</p></div><div class="feature-card"><h3>Commercial or complex purchases</h3><p>Business purchases, unclear supplier relationships, split contracts and non-consumer arrangements may require more detailed review.</p></div></div></div></section>

  <section id="evidence-checklist" class="section-wrap py-6"><div class="info-box soft-blue fade-up"><h2 class="text-3xl font-extrabold text-gray-900 mb-4">What Evidence Should You Gather?</h2><p class="text-gray-700 mb-6">A strong Section 75 complaint usually needs a clear payment trail, supplier evidence, problem evidence and loss evidence.</p><div class="grid md:grid-cols-2 gap-4 text-gray-700"><ul class="space-y-2"><li>&bull; Invoice, receipt and order confirmation</li><li>&bull; Credit-card statement and deposit proof</li><li>&bull; Contract, terms and conditions</li><li>&bull; Emails, letters and WhatsApp messages</li><li>&bull; Sales brochure, advert or website screenshots</li><li>&bull; Photographs or video evidence</li><li>&bull; Guarantees, warranties or certificates</li><li>&bull; Finance agreement or linked-credit documents</li><li>&bull; Expert, engineer or inspection reports</li></ul><ul class="space-y-2"><li>&bull; Complaint correspondence with the supplier</li><li>&bull; Card-provider complaint and replies</li><li>&bull; Timeline of events</li><li>&bull; Proof of losses and bank statements</li><li>&bull; Repair invoices or replacement quotes</li><li>&bull; Cancellation notices or failed delivery records</li><li>&bull; Final response letters</li><li>&bull; Ombudsman correspondence if already escalated</li><li>&bull; Notes of phone calls and dates</li></ul></div><a href="/guidance-section-75-evidence.html" class="inline-block mt-6 px-6 py-3 bg-blue-700 text-white rounded-full font-semibold hover:bg-blue-800 transition">Download the Section 75 Evidence Checklist</a></div></section>

  <section class="section-wrap py-6"><div class="info-box fade-up"><h2 class="text-3xl font-extrabold text-gray-900 mb-4">Step-by-Step Section 75 Process</h2><div class="card-grid"><div class="feature-card"><div class="step-badge">1</div><h3>Identify the purchase</h3><p>Confirm what was bought, who supplied it, how it was paid for and the total purchase value.</p></div><div class="feature-card"><div class="step-badge">2</div><h3>Set out the problem</h3><p>Explain whether the issue is faulty goods, non-delivery, cancelled service, breach of contract or misrepresentation.</p></div><div class="feature-card"><div class="step-badge">3</div><h3>Gather supplier evidence</h3><p>Keep supplier complaints, replies, refusal reasons, liquidation notices or proof that the supplier has not resolved the issue.</p></div><div class="feature-card"><div class="step-badge">4</div><h3>Prepare the card complaint</h3><p>Send a clear Section 75 complaint to the card provider with evidence, chronology and the practical remedy requested.</p></div><div class="feature-card"><div class="step-badge">5</div><h3>Review the response</h3><p>If declined, compare the decision with your documents and identify whether evidence or wording needs strengthening.</p></div><div class="feature-card"><div class="step-badge">6</div><h3>Consider escalation</h3><p>Where appropriate, a financial complaint may be escalated after the card provider has had the chance to respond.</p></div></div></div></section>

  <section class="section-wrap py-6"><div class="info-box soft-blue fade-up"><h2 class="text-3xl font-extrabold text-gray-900 mb-4">Common Reasons Section 75 Complaints Are Rejected</h2><div class="card-grid"><div class="feature-card"><h3>Poor evidence</h3><p>The card provider cannot see what was promised, what went wrong or how the loss is calculated.</p></div><div class="feature-card"><h3>Incomplete documents</h3><p>Missing invoices, payment records, terms or supplier replies make the complaint easier to decline.</p></div><div class="feature-card"><h3>Wrong legal basis</h3><p>The complaint may describe unfairness but not clearly explain breach of contract or misrepresentation.</p></div><div class="feature-card"><h3>No clear supplier link</h3><p>The card provider may dispute the connection between the payment, supplier and purchase.</p></div><div class="feature-card"><h3>Confusing chronology</h3><p>Scattered dates and messages can make a valid issue look unclear or unsupported.</p></div><div class="feature-card"><h3>Unsupported financial loss</h3><p>Refunds, repair costs, consequential loss or replacement costs need documents, not estimates alone.</p></div></div></div></section>

  <section class="section-wrap py-6"><div class="info-box fade-up"><h2 class="text-3xl font-extrabold text-gray-900 mb-4">Chargeback vs Section 75</h2><p class="text-gray-700 mb-6">Chargeback and Section 75 are often confused. They can both involve card payments, but they are different routes.</p><div class="overflow-x-auto"><table class="w-full text-left border-collapse bg-white rounded-2xl overflow-hidden"><thead class="bg-blue-800 text-white"><tr><th class="p-3">Issue</th><th class="p-3">Section 75</th><th class="p-3">Chargeback</th></tr></thead><tbody class="text-gray-700"><tr class="border-b"><td class="p-3 font-bold">Basis</td><td class="p-3">Consumer Credit Act 1974</td><td class="p-3">Card scheme rules</td></tr><tr class="border-b"><td class="p-3 font-bold">Who reviews it</td><td class="p-3">Credit-card issuer or connected lender</td><td class="p-3">Card issuer through the card scheme process</td></tr><tr class="border-b"><td class="p-3 font-bold">Typical use</td><td class="p-3">Breach of contract or misrepresentation on qualifying credit purchases</td><td class="p-3">Non-delivery, duplicate payment, cancelled service or card transaction dispute</td></tr><tr class="border-b"><td class="p-3 font-bold">Time limits</td><td class="p-3">Depends on facts and complaint route</td><td class="p-3">Usually shorter scheme deadlines</td></tr><tr><td class="p-3 font-bold">Evidence</td><td class="p-3">Contract, credit payment, supplier breach, loss and complaint history</td><td class="p-3">Transaction evidence, merchant issue, proof of non-delivery or refund refusal</td></tr></tbody></table></div></div></section>

  <section class="section-wrap py-6"><div class="info-box soft-blue fade-up"><h2 class="text-3xl font-extrabold text-gray-900 mb-4">Finance Agreements and Connected Lenders</h2><p class="text-gray-700 mb-4">Some purchases involve point-of-sale finance, linked credit or a lender connected to the supplier. In those cases, a finance-provider complaint route may need to be considered separately from an ordinary credit-card complaint.</p><p class="text-gray-700">Quaerens explains this only in general terms and helps organise documents. If specialist or regulated support may be needed, we explain that before any next step is taken.</p></div></section>

  <section class="section-wrap py-6"><div class="info-box fade-up"><h2 class="text-3xl font-extrabold text-gray-900 mb-4">Example Consumer Situations</h2><p class="text-gray-700 mb-6">These anonymised examples show common evidence patterns. They do not describe guaranteed outcomes.</p><div class="card-grid"><div class="feature-card"><h3>Holiday park purchase</h3><p>A consumer paid a deposit by credit card for a static caravan and later disputed sales promises about site fees and resale. The documents reviewed included the invoice, card statement, sales brochure, agreement and complaint replies.</p></div><div class="feature-card"><h3>Spray foam installation</h3><p>A homeowner used card or finance payments for spray foam and later faced mortgage or survey concerns. The review focused on sales promises, product paperwork, lender comments and removal quotes.</p></div><div class="feature-card"><h3>Solar installation</h3><p>A solar-panel customer disputed savings projections and system performance. The evidence included sales figures, finance paperwork, generation data, installer replies and repair records.</p></div><div class="feature-card"><h3>Travel booking</h3><p>A travel booking was cancelled or not delivered as expected. The review looked at booking terms, payment records, cancellation notices, supplier replies and any chargeback attempt.</p></div><div class="feature-card"><h3>Furniture purchase</h3><p>A furniture order arrived damaged, incomplete or not as described. Evidence included the order confirmation, photos, delivery notes, repair attempts and retailer correspondence.</p></div></div></div></section>

e financial disputes hub</span></a><a href="/consumer-rights-hub.html" class="feature-card block hover:border-blue-300 transition"><h3>Consumer Rights Hub</h3><p>Refunds, complaint wording, evidence guides and escalation routes.</p><span class="guidance-card-action">Visit the Consumer Rights Hub</span></a><a href="/travel-claims-hub.html" class="feature-card block hover:border-blue-300 transition"><h3>Travel claims and card evidence</h3><p>Organise cancellation, refund and supplier-failure travel evidence.</p><span class="guidance-card-action">Review travel payment disputes</span></a><a href="/property-disputes-hub.html" class="feature-card block hover:border-blue-300 transition"><h3>Property disputes hub</h3><p>Home improvement, contractor, spray foam and solar evidence routes.</p><span class="guidance-card-action">Visit the property disputes hub</span></a></div></div></section>

  <section class="section-wrap py-6"><div class="info-box fade-up"><h2 class="text-3xl font-extrabold text-gray-900 mb-4">Official References</h2><ul class="space-y-3 text-gray-700"><li><a class="text-blue-700 font-bold" href="https://www.legislation.gov.uk/ukpga/1974/39/section/75" target="_blank" rel="noopener">Consumer Credit Act 1974, Section 75</a></li><li><a class="text-blue-700 font-bold" href="https://www.financial-ombudsman.org.uk/data-insight/our-insight/common-myths-about-section-75" target="_blank" rel="noopener">Financial Ombudsman Service: common myths about Section 75</a></li><li><a class="text-blue-700 font-bold" href="https://www.financial-ombudsman.org.uk/consumers/how-to-complain" target="_blank" rel="noopener">Financial Ombudsman Service: how to complain</a></li><li><a class="text-blue-700 font-bold" href="https://www.fca.org.uk/consumers/how-complain" target="_blank" rel="noopener">Financial Conduct Authority: how to complain</a></li><li><a class="text-blue-700 font-bold" href="https://www.citizensadvice.org.uk/consumer/get-more-help/if-you-need-more-help-about-a-consumer-issue/" target="_blank" rel="noopener">Citizens Advice: consumer help</a></li></ul></div></section>

  <section class="section-wrap py-6"><div class="info-box soft-blue fade-up"><h2 class="text-3xl font-extrabold text-gray-900 mb-6">Frequently Asked Questions</h2><div class="space-y-4"><div class="faq-item"><button class="faq-button" type="button"><span>What is Section 75?</span><span class="faq-icon">+</span></button><div class="faq-content">Section 75 is part of the Consumer Credit Act 1974. In some qualifying credit-card purchases, the card issuer may be jointly responsible with the supplier if there has been a breach of contract or misrepresentation.</div></div><div class="faq-item"><button class="faq-button" type="button"><span>Can I use Section 75 after the company closed?</span><span class="faq-icon">+</span></button><div class="faq-content">Possibly. If the supplier has stopped trading, Section 75 may still be relevant if the purchase qualifies and the evidence shows breach of contract or misrepresentation.</div></div><div class="faq-item"><button class="faq-button" type="button"><span>Can I claim if I only paid a deposit by credit card?</span><span class="faq-icon">+</span></button><div class="faq-content">In some cases, yes. A qualifying credit-card deposit may be enough if the total cash price falls within the relevant limits and the supplier relationship is clear.</div></div><div class="faq-item"><button class="faq-button" type="button"><span>What if I paid by debit card?</span><span class="faq-icon">+</span></button><div class="faq-content">Section 75 is for qualifying credit arrangements, not ordinary debit-card payments. A chargeback route may be worth checking instead, depending on timing and scheme rules.</div></div><div class="faq-item"><button class="faq-button" type="button"><span>Can I claim for services?</span><span class="faq-icon">+</span></button><div class="faq-content">Yes, services may be relevant where the qualifying purchase conditions are met and there is evidence of breach of contract or misrepresentation.</div></div><div class="faq-item"><button class="faq-button" type="button"><span>Does Section 75 apply abroad?</span><span class="faq-icon">+</span></button><div class="faq-content">It can apply to some overseas purchases, but the payment route, supplier relationship and evidence still matter. Cross-border facts should be organised carefully.</div></div><div class="faq-item"><button class="faq-button" type="button"><span>Can I claim after several years?</span><span class="faq-icon">+</span></button><div class="faq-content">Timing can matter. The route may depend on when the purchase happened, when the issue was discovered, when you complained and any limitation or complaint deadlines.</div></div><div class="faq-item"><button class="faq-button" type="button"><span>Can I complain if finance was involved?</span><span class="faq-icon">+</span></button><div class="faq-content">Possibly. Connected lender or finance-provider routes may be relevant, but the agreement, parties, payment structure and complaint evidence need review.</div></div><div class="faq-item"><button class="faq-button" type="button"><span>Can I claim if I used PayPal?</span><span class="faq-icon">+</span></button><div class="faq-content">It depends how PayPal or another intermediary was used. Some third-party payment structures can complicate the direct link between card issuer, supplier and customer.</div></div><div class="faq-item"><button class="faq-button" type="button"><span>Can I claim if goods were faulty?</span><span class="faq-icon">+</span></button><div class="faq-content">Faulty goods may support a complaint if the purchase qualifies and the evidence shows the goods were not as described, not fit for purpose or otherwise breached the contract.</div></div><div class="faq-item"><button class="faq-button" type="button"><span>Can I claim for misrepresentation?</span><span class="faq-icon">+</span></button><div class="faq-content">Misrepresentation can be relevant where sales material, promises or explanations were inaccurate and influenced the decision to buy. Keep brochures, messages and sales notes.</div></div><div class="faq-item"><button class="faq-button" type="button"><span>Can I complain if the supplier ignored me?</span><span class="faq-icon">+</span></button><div class="faq-content">Yes, supplier silence can be part of the evidence file. Keep proof of your complaint, reminders, delivery records and any final response or lack of response.</div></div><div class="faq-item"><button class="faq-button" type="button"><span>What documents do I need?</span><span class="faq-icon">+</span></button><div class="faq-content">Useful documents include the invoice, receipt, credit-card statement, contract, emails, brochures, photographs, guarantees, expert reports, complaint replies and a clear timeline.</div></div><div class="faq-item"><button class="faq-button" type="button"><span>How long does a Section 75 complaint take?</span><span class="faq-icon">+</span></button><div class="faq-content">Timescales vary by card provider, evidence quality and whether escalation is needed. A clear chronology and complete evidence pack can make the review easier to follow.</div></div><div class="faq-item"><button class="faq-button" type="button"><span>What does Quaerens do?</span><span class="faq-icon">+</span></button><div class="faq-content">Quaerens helps organise evidence, prepare a chronology, identify gaps, structure complaint material and explain possible complaint or escalation routes. Outcomes are not guaranteed.</div></div></div></div></section>

          return;
        }

        if (button) {
          button.disabled = true;
          button.textContent = "Sending...";
        }

        try {
          await addDoc(collection(db, "internetCallbackRequests"), {
            name,
            phone,
            email,
            issue,
            preferredTime,
            note,
            status: "new",
            source: "service_page_callback",
            sourcePage: form.dataset.callbackPage || window.location.pathname.split("/").pop() || "unknown",
            sourceUrl: window.location.href,
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp(),
            userAgent: navigator.userAgent
          });
          form.reset();
          setCallbackMessage(form, "Thank you. Your call back request has been sent to our intake team.", false);
        } catch (error) {
          console.error("Callback request failed:", error);
          setCallbackMessage(form, "Sorry, we could not send this request. Please try again or call us.", true);
        } finally {
          if (button) {
            button.disabled = false;
            button.textContent = "Request My Free Initial Assessment";
          }
        }
      });
    });
  </script>
  <script src="quaerens-conversion-tracking.js" defer></script>
  <script src="quaerens-trust-shields.js" defer></script>
  <script type="module" src="/quaerens-live-chat.js"></script>
</body>
</html>
